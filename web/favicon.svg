<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The five-step review ramp, which is this index's signature mark.
       Ascending height and ink density, so it reads at 16px and in greyscale. -->
  <style>
    .ground { fill: #fbfbf9 }
    .rule   { fill: #a3a39c }
    .s1 { fill: #ccd1d0 } .s2 { fill: #9aa1a0 } .s3 { fill: #676e6d }
    .s4 { fill: #d6006b } .s5 { fill: #7a0039 }
    @media (prefers-color-scheme: dark) {
      .ground { fill: #0e1113 }
      .rule   { fill: #49514f }
      .s1 { fill: #343b3c } .s2 { fill: #575f60 } .s3 { fill: #848d8c }
      .s4 { fill: #ff3d93 } .s5 { fill: #ff85bd }
    }
  </style>
  <rect class="ground" width="32" height="32"/>
  <rect class="s1" x="3"  y="20" width="4" height="7"/>
  <rect class="s2" x="9"  y="17" width="4" height="10"/>
  <rect class="s3" x="15" y="13" width="4" height="14"/>
  <rect class="s4" x="21" y="9"  width="4" height="18"/>
  <rect class="s5" x="27" y="5"  width="2" height="22"/>
  <rect class="rule" x="3" y="28" width="26" height="1"/>
</svg>
